<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="heading">Rock Paper Scissor Game</h1>
    <div class="choices">
        <div class="choice">
            <img src="/images/rock.png">
        </div>
        <div class="choice">
            <img src="/images/paper.png">
        </div>
        <div class="choice">
            <img src="/images/scissors.png">
        </div>
    </div>

    <div class="scores">
        <div class="score" id="player-score">
            0
            <p>You</p>
        </div>
        <div class="score" id="computer-score">
            0
            <p>Computer</p>
        </div>
    </div>

    <div class="message">
        <div class="msg">Play Your Move</div>
    </div>
</body>
</html>
